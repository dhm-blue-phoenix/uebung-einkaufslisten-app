services:
  frontend:
    build:
      context: ../..
      dockerfile: containers/dev/frontend.Dockerfile
    command: ["sh", "-c", "npm ci && npm run start -- --poll=1000"]
    volumes:
      - ../../frontend:/devspace/frontend
      - frontend-node-modules:/devspace/frontend/node_modules
      - frontend-npm-cache:/root/.npm
    ports:
      - "1420:4200"

volumes:
  frontend-node-modules:
  frontend-npm-cache: